spring.application.name=backend
server.port=8082
frontend.urls=${FRONTEND_URLS:${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:3000}}

# HTTP Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=2048

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/golden_pearl_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:anand}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# prod and test
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# on dev time, we want to drop and recreate the schema to avoid issues with schema changes
# spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.profiles.active=dev

#Redis Configuration (can be overridden via environment variables)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000ms
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=5

